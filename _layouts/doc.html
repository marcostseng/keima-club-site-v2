---
layout: base
---
<section class="hero learn-hero" style="padding:0">
  <div class="wrap">
    <div>
      {% if page.crumb %}<div class="crumb"><a href="{{ page.crumb_url }}">{{ page.crumb }}</a></div>{% endif %}
      {% if page.badge %}<span class="status on" style="margin-bottom:14px">{{ page.badge }}</span>{% endif %}
      <h1>{{ page.title }}</h1>
      <p class="hero-lead">{{ page.description }}</p>
    </div>
  </div>
</section>
<article class="article">
  <div class="wrap">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
