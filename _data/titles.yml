  active: false
  accent: kon
  intro:
    zh: 以順位戰決定名人的會內棋戰。目前暫停舉辦，恢復時將在此公告。
    ja: 順位戦で名人を決めるクラブ内の棋戦です。現在は休止中で、再開の際はこちらでお知らせします。
