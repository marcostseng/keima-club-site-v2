# 棋戰資料：中日文頁面共用。新增優勝者時，在 results 最上面加一行。
- id: ryuma
  name: { zh: 龍馬盃, ja: 龍馬盃 }
  sub: { zh: 日本將棋公開賽　Taiwan Shogi Open, ja: 日本将棋オープン大会　Taiwan Shogi Open }
  active: true
  accent: murasaki
  intro:
    zh: 台灣每年舉辦的日本將棋公開賽。自第七屆（2026）起，由桂馬會日本將棋俱樂部主辦。
    ja: 台湾で開催している日本将棋のオープン大会です。第7回（2026年）より、桂馬会 日本将棋クラブが主催しています。
  news:
    zh: [{ date: "2026/10", text: 第七屆比賽章程（草案）公布：2026 年 12 月 19 日（六）於紀州庵文學森林（暫定）舉行，段位組、級位組分組比賽。 }]
    ja: [{ date: "2026/10", text: 第7回の大会要項（草案）を公開しました。2026年12月19日（土）、紀州庵文学森林（予定）にて、段位の部・級位の部に分かれて開催します。 }]
  rules:
    zh: 分段位組、級位組，兩組不混合對局。上午預選 3 輪（2 勝晉級、2 敗淘汰），下午單淘汰。報名費 NT$500，每組 32 人。段位組冠軍授予「龍馬」頭銜。詳細規定請見比賽章程。
    ja: 段位の部と級位の部に分かれ、両部門の対局はありません。午前は予選3局（2勝で通過、2敗で敗退）、午後はトーナメント。参加費NT$500、各部門32名まで。段位の部の優勝者に「龍馬」の称号を授与します。詳細は大会要項をご覧ください。
  doc:
    url: { zh: /titles/ryuma-2026/, ja: /jp/titles/ryuma-2026/ }
    label: { zh: 查看第七屆比賽章程, ja: 第7回 大会要項を見る }
  signup: { zh: 報名第七屆龍馬盃, ja: 第7回龍馬盃に申し込む }
  results:
    - { year: "2026", ed: 7, upcoming: true }
