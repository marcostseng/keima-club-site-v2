title: 桂馬會
url: https://keima.club
lang: zh-Hant-TW

# Google Analytics 4 評估 ID（例如 G-ABC123XYZ）；留空則不載入
ga4_id: "G-HMV767MSTQ"

# 棋譜日期在今天之後也照常產生頁面
future: true
timezone: Asia/Taipei

collections:
  lessons:
    output: true
    permalink: /learn/:name/
  redirects:            # 舊網站網址轉址（_redirects 資料夾，一個檔案一個網址）
    output: true
  strategies:           # 將棋資料庫：戰法圖鑑（_strategies 資料夾，一個戰法一個檔案）
    output: true
    permalink: /strategies/:name/
  games:                # 將棋資料庫：棋譜（_games 資料夾，一局一個檔案）
    output: true
    permalink: /games/:name/
  players:              # 將棋資料庫：棋手（_players 資料夾，一人一個檔案，需本人同意）
    output: true
    permalink: /players/:name/

defaults:
  - scope: { type: lessons }
    values: { layout: lesson, lang: zh }
  - scope: { type: redirects }
    values: { layout: redirect }
  - scope: { type: strategies }
    values: { layout: strategy, lang: zh }
  - scope: { type: games }
    values: { layout: game, lang: zh }
  - scope: { type: players }
    values: { layout: player, lang: zh }
  - scope: { path: "" }
    values: { lang: zh }
  - scope: { path: "jp" }
    values: { lang: ja }

exclude:
  - README.md
  - apps-script
  - preview
